name: Generar APK Stretch Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Buscar archivo Gradle
        run: |
          find . -name "build.gradle.kts" -print

      - name: Buscar proyecto Android
        run: |
          find . -name "settings.gradle.kts" -o -name "build.gradle.kts"

      - name: Compilar APK
        run: |
          cd "$(dirname "$(find . -name settings.gradle.kts | head -n 1)")"
          gradle assembleDebug
  

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Stretch-Mobile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
