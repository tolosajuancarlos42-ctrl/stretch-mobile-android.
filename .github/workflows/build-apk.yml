

name: Generar APK Stretch Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Revisar archivo ZIP
        run: |
          echo "ARCHIVOS DEL REPOSITORIO:"
          ls -la
          echo "CONTENIDO DEL ZIP:"
          unzip -l StretchMobile_Android_1.0.2-2.zip | head -80

      - name: Extraer proyecto
        run: |
          unzip -o StretchMobile_Android_1.0.2-2.zip -d proyecto -x '.github/*'

      - name: Buscar archivos Android
        run: |
          echo "BUSCANDO CONFIGURACION:"
          find proyecto -type f \( -name "settings.gradle.kts" -o -name "build.gradle.kts" \)

