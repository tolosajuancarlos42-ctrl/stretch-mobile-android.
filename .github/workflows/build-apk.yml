
name: Generar APK Stretch Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extraer proyecto Android
        run: |
          unzip -o StretchMobile_Android_1.0.2-2.zip -d proyecto -x '.github/*'

      - name: Corregir Java y Kotlin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("proyecto/app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              "sourceCompatibility = JavaVersion.VERSION_1_8",
              "sourceCompatibility = JavaVersion.VERSION_17"
          )
          s = s.replace(
              "targetCompatibility = JavaVersion.VERSION_1_8",
              "targetCompatibility = JavaVersion.VERSION_17"
          )

          if "compileOptions" in s and "VERSION_17" not in s:
              s = s.replace("VERSION_1_8", "VERSION_17")

          p.write_text(s)
          print("Configuración actualizada")
          PY

      - name: Compilar APK
        run: gradle -p proyecto assembleDebug --stacktrace

      - name: Comprobar APK
        run: |
          test -f proyecto/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Stretch-Mobile-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
